[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egms-qa"
version = "1.0.0"
description = "EGMS-QA: natural-language question answering over persistent-scatterer displacement time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "safetensors>=0.4",
  "huggingface_hub>=0.28",
  "torch>=2.1",
]

[project.optional-dependencies]
# Task reference-value computation over the raw tile store.
tasks = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]
# Translator training / evaluation on host language models.
translator = [
  "transformers>=5.5.3,<6",
  "peft>=0.18.1,<1",
  "accelerate>=0.28",
  "bitsandbytes>=0.43",
  "quantulum3>=0.10,<0.11",
]
test = [
  "pytest>=8,<10",
  "quantulum3>=0.10,<0.11",
]

[project.scripts]
egms-qa-release = "egms_qa.release:main"
egms-encoder-install-data = "egms_encoder.install_data:main"
egms-encoder-pretrain = "egms_encoder.pretrain:main"
egms-encoder-extract-tokens = "egms_encoder.extract_tokens:main"
egms-qa-build-labels = "egms_qa.qa_construction.build_labels:main"
egms-qa-generate = "egms_qa.qa_construction.generate_qa:main"
egms-qa-train = "egms_qa.translator.train:main"
egms-qa-evaluate = "egms_qa.translator.evaluate:main"

[project.urls]
Homepage = "https://github.com/risenyard/egms-qa"
Repository = "https://github.com/risenyard/egms-qa"
Issues = "https://github.com/risenyard/egms-qa/issues"
Dataset = "https://huggingface.co/datasets/risenyard/egms-qa-dataset"
Models = "https://huggingface.co/risenyard"

[tool.setuptools.packages.find]
where = ["src"]
include = ["egms_qa*", "egms_encoder*"]

[tool.setuptools.package-data]
egms_qa = ["qa_construction/**/*.md", "translator/*.md"]
egms_encoder = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hf_integration: checks the staged or downloaded Hugging Face release artifacts",
]
